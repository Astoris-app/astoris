# Release: Container-Image nach GHCR + GitHub-Release.
# Nur GitHub-eigene Actions (Repo-Richtlinie); Docker-Schritte laufen als Shell-Befehle.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Bestehender Tag (z. B. v0.1.0)'
        required: true
permissions:
  contents: read
jobs:
  image:
    name: Container image (GHCR)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - name: Enable arm64 emulation and buildx
        run: |
          docker run --privileged --rm tonistiigi/binfmt:qemu-v9.2.2-52 --install arm64
          docker buildx create --use --name astoris-builder
      - name: Login to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and push (amd64 + arm64)
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          image="ghcr.io/${REPO,,}"
          version="${TAG#v}"
          major_minor="${version%.*}"
          docker buildx build . \
            --platform linux/amd64,linux/arm64 \
            --tag "$image:$version" \
            --tag "$image:$major_minor" \
            --tag "$image:latest" \
            --label "org.opencontainers.image.source=https://github.com/$REPO" \
            --label "org.opencontainers.image.version=$version" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --cache-from type=gha --cache-to type=gha,mode=max \
            --push

  release:
    name: GitHub Release
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release view "$TAG" -R "$REPO" >/dev/null 2>&1 && exit 0
          gh release create "$TAG" -R "$REPO" --generate-notes --title "Astoris $TAG" \
            --notes "Container-Image: \`ghcr.io/${REPO,,}:${TAG#v}\` (linux/amd64, linux/arm64). Quellcode als ZIP/tar.gz unten; Installation siehe INSTALL.md."
